spring.application.name=roomroot-backend

# Database Configuration (Environment variable overrides with local defaults)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/roomroot}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# RoomRoot Security & JWT Configuration
# Default 256-bit secret key for local development; override with JWT_SECRET in production
roomroot.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
roomroot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Email addresses granted access to the admin console during OTP login.
roomroot.admin.emails=${ADMIN_EMAILS:jayeshjedhe117@gmail.com}

# CORS Configuration
roomroot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}

# EmailJS Configuration (reuses the OTP project's EmailJS service)
# The OTP is sent directly to the USER's email address via EmailJS.
roomroot.email.js-public-key=${EMAILJS_PUBLIC_KEY:TO1RULgL1bEz9k0oV}
roomroot.email.js-service-id=${EMAILJS_SERVICE_ID:service_xj8d7el}
roomroot.email.js-template-id=${EMAILJS_TEMPLATE_ID:template_oo5843q}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

